</style></head><body><div id="root"></div><script>
const CATS=['Work','Learning','Health','Personal','Social','Rest','Errands','Finance'];const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const COLORS={Work:['#3A86C8','#DAEAF8','#1B4F79'],Learning:['#7B68C8','#E8E4F8','#3D2F7A'],Health:['#4AADBA','#D8F2F5','#1D6170'],Personal:['#5BAAE0','#D4EAFA','#1C4D72'],Social:['#9B7DC8','#EDE4F8','#4A2C7A'],Rest:['#6BBCD4','#D8EFF8','#1D5C72'],Errands:['#D98A3D','#F7E6D0','#7A4A14'],Finance:['#4FAE87','#D8F2E7','#1C6146']};let entries=JSON.parse(localStorage.tjEntries||'null')||[];let rules=JSON.parse(localStorage.tjRules||'null')||[{contains:'running',category:'Health'},{contains:'run',category:'Health'},{contains:'gym',category:'Health'},{contains:'sleep',category:'Rest'},{contains:'cinema city',category:'Work'},{contains:'work',category:'Work'},{contains:'university',category:'Learning'},{contains:'study',category:'Learning'}];let health=JSON.parse(localStorage.tjHealth||'null')||{connected:false,sleep:true,exercise:true};let sheet=JSON.parse(localStorage.tjSheet||'null')||{connected:false,url:''};let notes=JSON.parse(localStorage.tjNotes||'null')||[];const WEEK_START=new Date(2026,7,10);let screen='home',selected=null,modal=false,tab='manual',editId=null,toast='',menuOpen=false;function save(){localStorage.tjEntries=JSON.stringify(entries);localStorage.tjRules=JSON.stringify(rules);localStorage.tjHealth=JSON.stringify(health);localStorage.tjSheet=JSON.stringify(sheet);localStorage.tjNotes=JSON.stringify(notes)}function exportBackup(){let data={entries,rules,notes,health,sheet,exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='time-journal-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup downloaded')}function importBackup(input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(Array.isArray(d.entries))entries=d.entries;if(Array.isArray(d.rules))rules=d.rules;if(Array.isArray(d.notes))notes=d.notes;if(d.health)health=d.health;if(d.sheet)sheet=d.sheet;save();notify('Backup imported');render()}catch(e){notify('Could not read that file')}};r.readAsText(f);input.value=''}function fmt(h){let H=Math.floor(h),m=Math.round((h-H)*60);return H?(m?H+'h '+m+'m':H+'h'):m+'m'}function guess(s){let n=s.toLowerCase();let r=rules.find(x=>x.contains&&n.includes(x.contains.toLowerCase()));if(r)return r.category;if(/run|walk|hike|gym|yoga|cycl|swim|workout|exercise/.test(n))return'Health';if(/sleep|nap|rest|relax|movie|tv|game/.test(n))return'Rest';if(/work|client|meeting|email|call|deploy|code|shift|cinema city/.test(n))return'Work';if(/read|course|study|learn|podcast|book|lecture|university/.test(n))return'Learning';if(/friend|party|dinner|social|coffee|gather|date/.test(n))return'Social';return'Personal'}function dayDate(v){let d=new Date(v);return isNaN(d)?'Mon':DAYS[d.getDay()===0?6:d.getDay()-1]}function dur(v){if(typeof v==='number')return v;let s=String(v).trim(),m=s.match(/^(\d+):(\d+)(?::(\d+))?$/);if(m)return +m[1]+ +m[2]/60+ +(m[3]||0)/3600;let n=parseFloat(s);return isNaN(n)?0:n>24?n/60:n}function parseRow(r){let ks=Object.keys(r),find=(...ps)=>ks.find(k=>ps.some(p=>p.test(k))),a=find(/activity|task|name|description|title/i),h=find(/hours?|duration|time/i),d=find(/day|date|weekday/i),c=find(/category|type|tag/i),n=find(/note|comment|detail/i);if(!a)return null;let hours=h?dur(r[h]):0;if(hours<=0)return null;let raw=c?String(r[c]).trim():'';return{activity:String(r[a]).trim(),category:CATS.includes(raw)?raw:guess(r[a]),hours:Math.round(hours*4)/4,day:d?(DAYS.find(x=>x.toLowerCase()===String(r[d]).slice(0,3).toLowerCase())||dayDate(r[d])):'Mon',note:n?String(r[n]):'',source:'excel'}}function addImported(rows,source){entries.push(...rows.map((r,i)=>({...r,id:source+Date.now()+i,source})));save();notify(rows.length+' records imported');render()}function notify(t){toast=t;render();setTimeout(()=>{toast='';render()},2500)}function totals(){let t=Object.fromEntries(CATS.map(c=>[c,0])),d=Object.fromEntries(DAYS.map(x=>[x,0]));entries.forEach(e=>{t[e.category]+=e.hours;d[e.day]+=e.hours});return{t,d,total:entries.reduce((s,e)=>s+e.hours,0)}}function btn(text,fn,primary=true){return `<button class="${primary?'primary':'secondary'}" onclick="${fn}">${text}</button>`}function toggleMenu(e){if(e)e.stopPropagation();menuOpen=!menuOpen;render()}function navTo(s){screen=s;menuOpen=false;selected=null;render()}function butterflyMenu(size){let items=[['home','Home page'],['tracker','View my week'],['calendar','Calendar'],['notes','Notes']];return `<div class="butterflywrap"><img class="butterfly" src="butterfly.png" width="${size}" onclick="toggleMenu(event)">${menuOpen?`<div class="dropdown" onclick="event.stopPropagation()">${items.map(([s,label])=>`<button class="${screen===s?'active':''}" onclick="navTo('${s}')">${label}</button>`).join('')}</div>`:''}</div>`}
document.addEventListener('click',()=>{if(menuOpen){menuOpen=false;render()}});function render(){save();let t=totals();let html='';if(screen==='home')html=home(t);else if(screen==='tracker')html=tracker(t);else if(screen==='settings')html=settings();else if(screen==='rules')html=rulesPage();else if(screen==='calendar')html=calendarPage();else html=notesPage();document.getElementById('root').innerHTML=html+(toast?`<div class="toast">${toast}</div>`:'');if(modal)document.getElementById('root').insertAdjacentHTML('beforeend',modalHtml());updateCatScroll()}function updateCatScroll(){let el=document.getElementById('catscroll'),line=document.getElementById('catscrollline');if(!el||!line)return;let needs=el.scrollHeight>el.clientHeight+1;line.style.display=needs?'block':'none';if(!needs)return;let trackH=line.clientHeight,thumbH=Math.max((el.clientHeight/el.scrollHeight)*trackH,18),maxScroll=el.scrollHeight-el.clientHeight,thumbTop=maxScroll>0?(el.scrollTop/maxScroll)*(trackH-thumbH):0,thumb=line.firstElementChild;thumb.style.height=thumbH+'px';thumb.style.top=thumbTop+'px'}window.addEventListener('resize',updateCatScroll);
function home(t){let summary=t.total>0?`You've logged <b>${fmt(t.total)}</b> across <b>${DAYS.filter(d=>t.d[d]>0).length} days</b>. Most of it went to <b>${Object.entries(t.t).sort((a,b)=>b[1]-a[1])[0][0]}</b>.`:`You haven't logged anything yet — tap below to add your first entry, or import a spreadsheet from Settings.`;return `<div class="home"><div class="top"><div class="brand">${butterflyMenu(28)}Time Journal</div><button class="ghost" onclick="screen='settings';render()">Settings</button></div><div class="hero"><img class="butterfly" src="butterfly.png" width="80"><div class="eyebrow" style="margin-top:18px">Good afternoon</div><h1>How are you<br><em>spending</em> your<br>time this week?</h1><p>${summary}</p><div class="bars">${DAYS.map(d=>`<div class="mini"><i><b style="height:${Math.max((t.d[d]/Math.max(...Object.values(t.d),1))*50,t.d[d]?4:2)}px"></b></i>${d}</div>`).join('')}</div><div class="actions">${btn('View my week →',"screen='tracker';render()")}${btn('+ Log time',"openModal();render()",false)}</div></div><div class="footer">${t.total.toFixed(1)}h total</div></div>`}
function donut(t){let total=t.total||1,offset=0;let stops=[];CATS.forEach(c=>{let pct=(t.t[c]||0)/total*100;let a=offset,b=offset+pct;stops.push(`${COLORS[c][0]} ${a.toFixed(2)}% ${b.toFixed(2)}%`);offset=b});return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="donut-center"><strong>${fmt(t.total)}</strong><span>this week</span></div></div></div><div class="legend">${CATS.filter(c=>t.t[c]>0).map(c=>`<div class="legend-item"><i class="legend-dot" style="background:${COLORS[c][0]}"></i><span>${c} · ${((t.t[c]/t.total)*100).toFixed(0)}%</span></div>`).join('')}</div>`}
function tracker(t){let visible=selected?entries.filter(e=>e.day===selected):entries;let max=Math.max(...Object.values(t.d),1);return `<div class="app"><div class="header"><div class="header-left">${butterflyMenu(34)}<div><div class="eyebrow">Aug 11 – 17, 2026</div><div class="title">Time Journal</div></div></div><div>${btn('Settings',"screen='settings';render()",false)} ${btn('+ Log time','openModal();render()')}</div></div><div class="container"><div class="trackertitle">Time flies — make sure you <em>don't waste it</em>.</div><div class="stats"><div class="card"><div class="statlabel">Total hours</div><div class="statvalue">${fmt(t.total)}</div></div><div class="card"><div class="statlabel">Days logged</div><div class="statvalue">${DAYS.filter(d=>t.d[d]>0).length}</div></div><div class="card"><div class="statlabel">Top category</div><div class="statvalue">${Object.entries(t.t).sort((a,b)=>b[1]-a[1])[0][0]}</div></div><div class="card"><div class="statlabel">Avg / day</div><div class="statvalue">${fmt(t.total/7)}</div></div></div><div class="eyebrow" style="margin-bottom:8px">Week at a glance</div><div class="card"><div class="week">${DAYS.map(d=>{let p=t.d[d]/max*100;return `<div class="day" onclick="selected=selected==='${d}'?null:'${d}';render()"><div class="daynum">${t.d[d]?fmt(t.d[d]):'—'}</div><div class="daybar"><div class="dayfill" style="height:${p}%;outline:${selected===d?'2px solid #3A86C8':'none'};background:${COLORS[catsForDay(d,t)][0]}"></div></div><div class="dayname">${d}</div></div>`}).join('')}</div></div><div class="overview-panels" style="margin-top:24px"><div class="panelcol"><div class="eyebrow">By category</div><div class="panel category-card"><div class="catscroll-wrap"><div class="catscroll" id="catscroll" onscroll="updateCatScroll()">${CATS.map(c=>{let p=t.total?t.t[c]/t.total*100:0;return `<div class="catrow"><div class="catline"><span>${c}</span><span class="mono">${fmt(t.t[c])} · ${p.toFixed(0)}%</span></div><div class="track"><i style="width:${p}%;background:${COLORS[c][0]}"></i></div></div>`}).join('')}</div><div class="scrollline" id="catscrollline"><i></i></div></div></div></div><div class="panelcol"><div class="eyebrow">How you spent your week</div><div class="panel donut-panel">${donut(t)}</div></div></div><div class="entries-section"><div class="columns-title"><div class="eyebrow">${selected?selected+' — '+fmt(t.d[selected]):'All entries'}</div>${selected?`<button class="ghost" onclick="selected=null;render()">← All entries</button>`:''}</div><div class="entries-list">${visible.map(e=>entryHtml(e)).join('')}</div></div></div></div>`}
function catsForDay(d,t){let vals=CATS.filter(c=>entries.some(e=>e.day===d&&e.category===c&&e.hours>0));return vals.length?vals[0]:'Work'}
function entryHtml(e){let c=COLORS[e.category];return `<div class="entry"><div class="stripe" style="background:${c[0]}"></div><div class="entrymain"><div class="entryname">${e.activity}</div>${e.note?`<div class="note">${e.note}</div>`:''}</div><span class="pill" style="background:${c[1]};color:${c[2]}">${e.category}</span><span class="mono">${fmt(e.hours)}</span><span class="mono">${e.day}</span><button class="iconbtn" onclick="openModal('${e.id}');render()">✎</button><button class="iconbtn" onclick="entries=entries.filter(x=>x.id!=='${e.id}');save();render()">✕</button></div>`}
function settings(){return `<div class="app"><div class="header"><div class="header-left"><button class="iconbtn" onclick="screen='tracker';render()">←</button>${butterflyMenu(34)}<div class="title">Connections & settings</div></div></div><main class="settings"><div class="card"><div class="settinghead"><div><div class="eyebrow">Apple Health</div><div class="settingtitle">Choose the health data you share</div><div class="muted">Demo mode simulates the iPhone HealthKit connection. Only the two options below are used.</div></div><span class="status">${health.connected?'Connected':'Not connected'}</span></div><div class="checks"><label class="check"><input type="checkbox" ${health.sleep?'checked':''} onchange="health.sleep=this.checked;save()"> <b>Sleep</b><div class="muted">Sleep duration</div></label><label class="check"><input type="checkbox" ${health.exercise?'checked':''} onchange="health.exercise=this.checked;save()"> <b>Exercise</b><div class="muted">Workout name + duration</div></label></div>${btn(health.connected?'Sync demo Health data':'Connect Apple Health','connectHealth()')}</div><div class="card"><div class="settinghead"><div><div class="eyebrow">Google Sheets</div><div class="settingtitle">Import your work schedule</div><div class="muted">Use a published CSV link from Google Sheets. The same columns as Excel are supported.</div></div><span class="status">${sheet.connected?'Saved':'Not connected'}</span></div><div class="row" style="margin-top:15px"><input class="input" value="${sheet.url}" oninput="sheet.url=this.value;save()" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv"><button class="secondary" onclick="sheet.connected=true;save();notify('Google Sheets connection saved')">Save</button></div>${btn('Sync Google Sheets', 'syncSheet()',false)}</div><div class="card"><div class="settinghead"><div><div class="eyebrow">Categorisation</div><div class="settingtitle">Teach the app your rules</div><div class="muted">For example: “Cinema City” → Work, “Running” → Health. Rules are applied automatically to imported records.</div></div>${btn('Manage rules →',"screen='rules';render()",false)}</div></div><div class="card"><div class="settinghead"><div><div class="eyebrow">Backup & sync</div><div class="settingtitle">Move your data between devices</div><div class="muted">Export a backup file, then save it into your iCloud Drive (or AirDrop it) so you can import it on your other device. Re-export after new entries to keep both in sync.</div></div></div><div class="row" style="margin-top:15px">${btn('Export backup','exportBackup()',false)}<label class="secondary" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-align:center">Import backup<input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label></div></div></main></div>`}
function rulesPage(){return `<div class="app"><div class="header"><div class="header-left"><button class="iconbtn" onclick="screen='settings';render()">←</button>${butterflyMenu(34)}<div class="title">Categorisation rules</div></div></div><main class="settings"><div class="card"><div class="eyebrow">Add a rule</div><div class="row" style="margin-top:10px"><input id="ruleText" class="input" placeholder="If activity contains… e.g. Cinema City"><select id="ruleCat" class="input" style="max-width:160px">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button class="primary" onclick="addRule()">Add</button></div></div><div class="card"><div class="eyebrow">Your rules</div><div class="rules">${rules.map((r,i)=>`<div class="rule"><span>If it contains <b>“${r.contains}”</b></span><span class="pill" style="background:${COLORS[r.category][1]};color:${COLORS[r.category][2]}">${r.category}</span><button class="iconbtn" onclick="rules.splice(${i},1);save();render()">✕</button></div>`).join('')}</div></div></main></div>`}
function openModal(id=null){modal=true;tab='manual';editId=id;if(id){let e=entries.find(x=>x.id===id);window.edit=e?{...e}:null}else window.edit=null}function modalHtml(){let e=window.edit||{activity:'',category:'Work',hours:'',day:selected||'Mon',note:''};return `<div class="modalback" onclick="if(event.target===this){modal=false;render()}"><div class="modal"><div class="tabs"><button class="tab ${tab==='manual'?'active':''}" onclick="tab='manual';render()">Manual entry</button><button class="tab ${tab==='import'?'active':''}" onclick="tab='import';render()">Import Excel</button></div>${tab==='manual'?`<div class="field"><label>Activity</label><input id="a" class="input" value="${e.activity}"></div><div class="row"><div class="field" style="flex:1"><label>Category</label><select id="c" class="input">${CATS.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" style="flex:1"><label>Day</label><select id="d" class="input">${DAYS.map(d=>`<option ${d===e.day?'selected':''}>${d}</option>`).join('')}</select></div></div><div class="field"><label>Hours spent</label><input id="h" class="input" type="number" step=".25" min=".25" value="${e.hours}"></div><div class="field"><label>Note</label><input id="n" class="input" value="${e.note||''}"></div><div class="actions"><button class="primary" onclick="saveEntry()">${editId?'Save changes':'Log entry'}</button><button class="secondary" onclick="modal=false;render()">Cancel</button></div>`:`<div class="settingtitle">Import your Excel or CSV</div><p class="muted">Use Activity, Hours, Day/Date, Category and Note columns. Rules are applied automatically.</p><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden onchange="readFile(this.files[0])"><div class="drop" onclick="document.getElementById('file').click()"><img src="butterfly.png" width="42"><p>Click to choose .xlsx, .xls or .csv</p></div><button class="secondary" style="margin-top:12px" onclick="modal=false;render()">Cancel</button>`}</div></div>`}
function saveEntry(){let e={id:editId||'m'+Date.now(),activity:document.getElementById('a').value.trim(),category:document.getElementById('c').value,hours:parseFloat(document.getElementById('h').value),day:document.getElementById('d').value,note:document.getElementById('n').value,source:'manual'};if(!e.activity||!e.hours)return;if(!editId)e.category=guess(e.activity);entries=editId?entries.map(x=>x.id===editId?e:x):[...entries,e];modal=false;save();notify(editId?'Entry updated':'Added to '+e.category)}function readFile(file){if(!file)return;let reader=new FileReader();if(/\.xlsx?$|\.xls$/i.test(file.name)){reader.onload=e=>{let wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''}).map(parseRow).filter(Boolean);if(rows.length)addImported(rows,'excel');else notify('No usable rows found')}}else{reader.onload=e=>{let lines=e.target.result.trim().split(/\r?\n/),heads=lines.shift().split(',');let rows=lines.map(l=>{let vals=l.split(',');let r={};heads.forEach((h,i)=>r[h]=vals[i]||'');return parseRow(r)}).filter(Boolean);if(rows.length)addImported(rows,'excel');else notify('No usable rows found')};reader.readAsText(file)}}function connectHealth(){health.connected=true;let rows=[];if(health.exercise){rows.push({activity:'Running — Apple Health',category:guess('running'),hours:.5,day:'Sun',note:'Imported exercise'});rows.push({activity:'Strength Training — Apple Health',category:'Health',hours:1,day:'Fri',note:'Imported exercise'})}if(health.sleep)rows.push({activity:'Sleep — Apple Health',category:guess('sleep'),hours:7.5,day:'Sun',note:'Imported sleep'});if(rows.length)addImported(rows,'apple-health');else notify('Select Sleep or Exercise first')}async function syncSheet(){if(!sheet.url)return notify('Paste a published CSV link first');try{let r=await fetch(sheet.url);let text=await r.text();let rows=[];let lines=text.trim().split(/\r?\n/),heads=lines.shift().split(',');lines.forEach(l=>{let vals=l.split(','),o={};heads.forEach((h,i)=>o[h]=vals[i]||'');let x=parseRow(o);if(x)rows.push(x)});if(rows.length)addImported(rows,'sheets');else notify('No usable rows found')}catch(e){notify('Could not fetch the sheet. Use a published CSV link.')}}function addRule(){let x=document.getElementById('ruleText').value.trim();if(!x)return;rules.push({contains:x,category:document.getElementById('ruleCat').value});save();render();notify('Rule added')}
function monthGrid(year,monthIdx){let first=new Date(year,monthIdx,1);let startOffset=(first.getDay()+6)%7;let daysInMonth=new Date(year,monthIdx+1,0).getDate();let cells=[];for(let i=0;i<startOffset;i++)cells.push('');for(let d=1;d<=daysInMonth;d++)cells.push(d);let monthName=first.toLocaleString('default',{month:'long'});let todayStr=new Date().toDateString();let tt=totals();let body=cells.map(d=>{if(!d)return `<div class="daycell"></div>`;let date=new Date(year,monthIdx,d);let diff=Math.round((date-WEEK_START)/86400000);let isToday=date.toDateString()===todayStr;if(diff>=0&&diff<7){let dayName=DAYS[diff];let hours=tt.d[dayName];let cat=hours>0?catsForDay(dayName,tt):null;let bg=cat?COLORS[cat][0]:'#D8ECFA';return `<div class="daycell active${isToday?' today':''}" style="background:${bg}" title="${dayName} · ${hours?fmt(hours):'No entries'}" onclick="screen='tracker';selected='${dayName}';menuOpen=false;render()">${d}</div>`}return `<div class="daycell${isToday?' today':''}">${d}</div>`}).join('');return `<div class="monthcard"><div class="monthtitle">${monthName}</div><div class="monthhead">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<span>${x}</span>`).join('')}</div><div class="monthbody">${body}</div></div>`}
function calendarPage(){let months=Array.from({length:12},(_,i)=>monthGrid(2026,i)).join('');return `<div class="app"><div class="header"><div class="header-left"><button class="iconbtn" onclick="screen='tracker';render()">←</button>${butterflyMenu(34)}<div class="title">Calendar</div></div></div><div class="container"><div class="trackertitle">Your year, <em>at a glance</em>.</div><p class="muted" style="margin:-16px 0 22px">Days from this week (Aug 10–16) are colored by how you spent them — tap one to jump to your week view.</p><div class="yeargrid">${months}</div></div></div>`}
function fmtDate(iso){let d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function addNote(){let v=document.getElementById('noteText').value.trim();if(!v)return;notes=[{id:'n'+Date.now(),text:v,date:new Date().toISOString()},...notes];save();render();notify('Note saved')}
function deleteNote(id){notes=notes.filter(x=>x.id!==id);save();render()}
function notesPage(){return `<div class="app"><div class="header"><div class="header-left"><button class="iconbtn" onclick="screen='tracker';render()">←</button>${butterflyMenu(34)}<div class="title">Notes</div></div></div><main class="settings"><div class="card"><div class="eyebrow">New note</div><div class="settingtitle" style="font-size:18px">Ideas for spending your time better</div><textarea id="noteText" class="input" placeholder="What would you change about this week?"></textarea><div class="actions" style="margin-top:12px">${btn('Save note','addNote()')}</div></div><div class="eyebrow" style="margin:22px 0 8px">${notes.length?'Your notes':'No notes yet — jot one down above'}</div>${notes.map(n=>`<div class="notecard"><div class="notedate"><span>${fmtDate(n.date)}</span><button class="iconbtn" onclick="deleteNote('${n.id}')">✕</button></div><div class="notetext">${n.text}</div></div>`).join('')}</main></div>`}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
